# Dependabot: weekly dependency updates for this package's npm development tooling and its GitHub Actions.
# The fleet policy is D41 (grouped weekly updates, minor and patch merged after CI) and D52 (declined majors as ignore rules), both in the
# workspace's docs/audit/LENS_GROUNDING_LOG.md. This package is not an app, so it has no Dockerfile entry and does not use the app template
# (templates/dependabot.app.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Few open pull requests at once: the groups below normally make it one or two a week.
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors are adopted deliberately, fleet-wide, not by a bot (D52; TypeScript 7 is the next one).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one pull request, merged once CI passes (D41).
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Actions are pinned by full commit SHA (D12); one pull request moves every pin together.
      github-actions:
        patterns: ['*']
